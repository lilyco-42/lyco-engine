[package]
name = "yuzu-cli"
description = "Project2 引擎命令行工具(psb/scn/pimg/xp3 检视与提取)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
zip = "2"
rust-embed = "8"
yuzu-psb = { path = "../yuzu-psb" }
yuzu-scn = { path = "../yuzu-scn" }
yuzu-pimg = { path = "../yuzu-pimg" }
yuzu-tlg = { path = "../yuzu-tlg" }
yuzu-xp3 = { path = "../yuzu-xp3" }
yuzu-kag = { path = "../yuzu-kag" }
yuzu-engine = { path = "../yuzu-engine" }
yuzu-server = { path = "../yuzu-server" }
