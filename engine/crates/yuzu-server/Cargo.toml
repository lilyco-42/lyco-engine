[package]
name = "yuzu-server"
description = "yuzu-web 资源后端 —— 懒加载 XP3 资源 / 反编译剧本 / 解码图像"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "yuzu-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yuzu-xp3 = { path = "../yuzu-xp3" }
yuzu-scn = { path = "../yuzu-scn" }
yuzu-pimg = { path = "../yuzu-pimg" }
yuzu-tlg = { path = "../yuzu-tlg" }
