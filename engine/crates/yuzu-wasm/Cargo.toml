[package]
name = "yuzu-wasm"
description = "Web 端 WASM 绑定(wasm-bindgen) — 把引擎暴露给浏览器"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
yuzu-engine = { path = "../yuzu-engine" }
yuzu-psb = { path = "../yuzu-psb" }
yuzu-scn = { path = "../yuzu-scn" }
yuzu-pimg = { path = "../yuzu-pimg" }
yuzu-tlg = { path = "../yuzu-tlg" }
yuzu-xp3 = { path = "../yuzu-xp3" }
yuzu-kag = { path = "../yuzu-kag" }