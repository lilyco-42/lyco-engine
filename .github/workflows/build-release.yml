name: build-release

# 跨平台构建 lyco CLI(纯 Rust 静态) + yuzu 引擎(主流平台) + WASM 组件(web 播放器)。
# 主流平台(Windows/macOS/Linux) + Termux(Android arm64)。
#
# 触发:
#   - push / PR 到 main:构建验证
#   - tag v*:构建全部平台产物并发布 GitHub Release

on:
  push:
    branches: [main]
    # 版本 tag:带 v 前缀(v0.1.0)或纯版本号(0.1.0)均可。
    # 纯版本号与 crates.io 版本一致,cargo-binstall 依赖它定位 release 资产。
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # lyco —— 纯 Rust 静态 CLI,主流平台 + Termux
  # ---------------------------------------------------------------
  lyco:
    name: lyco (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 资产名 = `lyco-{target}`(标准 target triple),匹配 cargo-binstall 约定。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu         # Linux x86_64(binstall 默认目标)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl        # Linux x86_64 静态(无 glibc 依赖)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl        # Linux arm64 静态
          - os: windows-latest
            target: x86_64-pc-windows-msvc            # Windows
          - os: macos-latest
            target: aarch64-apple-darwin              # macOS Apple Silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin               # macOS Intel

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux musl / 非宿主交叉目标需 cross 容器(静态链接,无需系统 libc)
      - name: Install cross
        if: contains(matrix.target, 'musl') || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@cross

      - name: Build (native)
        if: ${{ !(contains(matrix.target, 'musl') || matrix.target == 'aarch64-unknown-linux-gnu') }}
        run: cargo build --release --locked

      - name: Build (cross)
        if: contains(matrix.target, 'musl') || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          BIN=$( [ "${{ matrix.os }}" = "windows-latest" ] && echo "lyco.exe" || echo "lyco" )
          SRC="target/${{ matrix.target }}/release/$BIN"
          [ -f "$SRC" ] || SRC="target/release/$BIN"
          mkdir -p dist
          # 统一命名 `lyco-{target}`(Windows 也去 .exe),匹配 cargo-binstall 的 {target} 模板
          cp "$SRC" "dist/lyco-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: lyco-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Termux(Android arm64)—— 单独:目标 aarch64-linux-android
  # ---------------------------------------------------------------
  termux:
    name: lyco (termux / aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (via sdkmanager)
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build (aarch64-linux-android)
        run: cargo ndk --platform 24 -t arm64-v8a build --release --locked

      - name: Locate binary
        shell: bash
        run: |
          set -e
          BIN=$(find target -type f -name lyco | head -1)
          mkdir -p dist
          cp "$BIN" dist/lyco-aarch64-linux-android
          file dist/lyco-aarch64-linux-android || true

      - uses: actions/upload-artifact@v4
        with:
          name: lyco-aarch64-linux-android
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------
  # yuzu 引擎 —— 主流平台(yuzu-cli + yuzu-server)
  # ---------------------------------------------------------------
  engine:
    name: engine (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace (release)
        run: cargo build --release --locked -p yuzu-cli -p yuzu-server

      - name: Prepare artifacts
        shell: bash
        run: |
          set -e
          mkdir -p ../dist
          # 资产命名 `yuzu-cli-{target}`(Windows 也去 .exe),匹配 cargo-binstall 约定
          for b in yuzu-cli yuzu-server; do
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp "target/release/$b.exe" "../dist/$b-${{ matrix.target }}"
            else
              cp "target/release/$b" "../dist/$b-${{ matrix.target }}"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # WASM 组件(web 播放器引擎绑定)
  # ---------------------------------------------------------------
  wasm:
    name: wasm (yuzu-wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli 0.2.127
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build yuzu-wasm
        run: cargo build -p yuzu-wasm --target wasm32-unknown-unknown --release

      - name: Generate JS bindings (web + node)
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/yuzu_wasm.wasm \
            --out-dir web/pkg --target web --no-typescript
          wasm-bindgen target/wasm32-unknown-unknown/release/yuzu_wasm.wasm \
            --out-dir web/pkg-node --target nodejs --no-typescript

      - name: Upload wasm pkg
        uses: actions/upload-artifact@v4
        with:
          name: yuzu-wasm-web
          path: engine/web/pkg
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 发布 GitHub Release(版本 tag 时)
  # ---------------------------------------------------------------
  release:
    name: Publish Release
    # 版本 tag:带 v 前缀(v0.1.0)或纯版本号(0.1.0)均触发发布
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/0') || startsWith(github.ref, 'refs/tags/1') || startsWith(github.ref, 'refs/tags/2')
    needs: [lyco, termux, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
