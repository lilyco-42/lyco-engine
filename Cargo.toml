[package]
name = "lyco"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "统一多语言脚手架工具 · gh api 驱动 + 声明式模板"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
tar = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
