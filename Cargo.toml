[package]
name = "lyco"
version = "0.1.2"
edition = "2021"
rust-version = "1.70"
description = "统一多语言脚手架工具 · gh api 驱动 + 声明式模板"
license = "MIT"
repository = "https://github.com/lilyco-42/lyco-engine"
readme = "README.md"
keywords = ["scaffold", "template", "cli", "android", "minecraft"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "engine/", "tests/", "target/", "process_whitelist.json", ".opencode/", ".claude/"]

# cargo-binstall 索引:release 资产统一命名 `lyco-{target}`(Windows 也不带 .exe)。
# binstall 的 {target} 直接匹配;裸二进制由 pkg-fmt=bin 处理,Windows 下载后自动加 .exe。
[package.metadata.binstall]
pkg-url = "https://github.com/lilyco-42/lyco-engine/releases/download/{version}/lyco-{target}"
pkg-fmt = "bin"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
tar = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
